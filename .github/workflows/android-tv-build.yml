name: Build VELNIX TV APK

on:
  push:
    branches: [main]
    paths:
      - "tv-app/**"
      - ".github/workflows/android-tv-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android TV APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELNIX-TV-debug
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
