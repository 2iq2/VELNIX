name: Build VELNIX Android APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELNIX-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK download filename
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VELNIX.apk
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: VELNIX Android App
          body: Latest VELNIX Android application build.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: VELNIX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
