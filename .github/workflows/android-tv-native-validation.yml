name: Validate VELNIX TV native Media3 build

on:
  push:
    branches:
      - feature/tv-native-media3
      - feature/tv-redesign-v2
    paths:
      - "android-tv-app/**"
      - ".github/workflows/android-tv-native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build isolated Android TV test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager and accept licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Install Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble Android TV debug APK
        run: gradle -p android-tv-app :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s android-tv-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-tv-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELNIX-TV-native-Media3-experimental
          path: android-tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
