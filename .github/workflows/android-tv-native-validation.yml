name: Validate VELNIX TV native Media3 build

on:
  push:
    branches:
      - feature/tv-native-media3
    paths:
      - "android-tv-app/**"
      - ".github/workflows/android-tv-native-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build isolated Android TV test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble Android TV debug APK
        run: gradle -p android-tv-app :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s android-tv-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-tv-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELNIX-TV-native-Media3-experimental
          path: android-tv-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
